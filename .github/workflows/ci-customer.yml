# .GitHub/workflows/ci-customer.yml
name: CI - Customer Service

# Gatilhos: Roda em push/PR para main, mas só se houver mudanças na pasta do customer-service
on:
  push:
    branches:
      - main
      - feat/implementar_kafka_para_comunicação_dos_serviços
    paths:
      - 'customer-service/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'customer-service/**'

jobs:
  build-and-test-customer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Inicia containers do Postgres e RabbitMq para os testes de integração
    services:
      postgres:
        image: postgres:14.5
        # Variáveis de ambiente para criar o banco de dados de teste
        env:
          POSTGRES_USER: customeruser
          POSTGRES_PASSWORD: customerpass
          POSTGRES_DB: customerdb

        ports:
          - 5432:5432
        # ‘Health’ check para garantir que o banco está pronto antes dos testes
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.9-management
        env:
          RABBITMQ_DEFAULT_USER: orderSystemUser
          RABBITMQ_DEFAULT_PASS: orderSystem2925
        ports:
          - 5672:5672

    steps:
      # 1. Faz o checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4
      # 2. Configura o JDK 17 com cache do Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      # 3. Compila, testa e empacota o projeto com Maven
      - name: Build and Test with Maven
        # Define o diretório de trabalho para o microserviço do customer
        working-directory: ./customer-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/customerdb
          SPRING_DATASOURCE_USERNAME: customeruser
          SPRING_DATASOURCE_PASSWORD: customerpass
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: orderSystemUser
          SPRING_RABBITMQ_PASSWORD: orderSystem2925
        run: mvn -B package --file pom.xml

  build-and-test-customer-kafka:
    if: github.ref == 'refs/heads/feat/implementar_kafka_para_comunicação_dos_serviços'
    runs-on: ubuntu-latest

    # Inicia containers do Postgres e RabbitMq para os testes de integração
    services:
      postgres:
        image: postgres:14.5
        # Variáveis de ambiente para criar o banco de dados de teste
        env:
          POSTGRES_USER: customeruser
          POSTGRES_PASSWORD: customerpass
          POSTGRES_DB: customerdb

        ports:
          - 5432:5432
        # ‘Health’ check para garantir que o banco está pronto antes dos testes
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        ports:
          - "2181:2181"
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        ports:
          - "9092:9092"
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    steps:
      # Faz o checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_ACCESS_TOKEN}}

      # Configura o JDK 17 com cache do Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      # Compila, testa e empacota o projeto com Maven
      - name: Build and Test with Maven
        # Define o diretório de trabalho para o microserviço do customer
        working-directory: ./customer-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/customerdb
          SPRING_DATASOURCE_USERNAME: customeruser
          SPRING_DATASOURCE_PASSWORD: customerpass
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: mvn clean package

      - name: Docker Compose Build
        run: docker compose build

      - name: Tag Docker Images
        run: docker tag ${{secrets.DOCKER_USERNAME}}/ordersystem-customer-service:latest ${{secrets.DOCKER_USERNAME}}/ordersystem-customer-service:kafka_${{github.RUN_ID}}

      - name: Push Docker Images
        run: |
          docker push ${{secrets.DOCKER_USERNAME}}/ordersystem-customer-service:latest
          docker push ${{secrets.DOCKER_USERNAME}}/ordersystem-customer-service:kafka_${{github.RUN_ID}}