services:
  postgres-order:
    image: postgres:15
    container_name: postgres-order
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata_order:/var/lib/postgresql/data
    networks:
      - springnet
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orderuser", "-d", "orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-customer:
    image: postgres:15
    container_name: postgres-customer
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: customeruser
      POSTGRES_PASSWORD: customerpass
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - pgdata_customer:/var/lib/postgresql/data
    networks:
      - springnet
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "customeruser", "-d" , "customerdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-restaurant:
    image: postgres:15
    container_name: postgres-restaurant
    environment:
      POSTGRES_DB: restaurantdb
      POSTGRES_USER: restaurantuser
      POSTGRES_PASSWORD: restaurantpass
      TZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    volumes:
      - pgdata_restaurant:/var/lib/postgresql/data
    networks:
      - springnet
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "restaurantuser", "-d" , "restaurantdb" ]
      interval: 5s
      timeout: 5s
      retries: 5
      
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - springnet

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - springnet

  order-management:
    image: matheusscola/ordersystem-order-management:test_kafka
    container_name: order-management
    depends_on:
      postgres-order:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/orderdb
      SPRING_DATASOURCE_USERNAME: orderuser
      SPRING_DATASOURCE_PASSWORD: orderpass
      RABBIT_INIT_ENABLED: "true"
      DEBUG_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      TZ: America/Sao_Paulo
      JAVA_OPTS: -Duser.timezone=America/Sao_Paulo
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - springnet

  customer-service:
    image: matheusscola/ordersystem-customer-service:test_kafka
    container_name: customer-service
    depends_on:
      postgres-customer:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-customer:5432/customerdb
      SPRING_DATASOURCE_USERNAME: customeruser
      SPRING_DATASOURCE_PASSWORD: customerpass
      DEBUG_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"
      TZ: America/Sao_Paulo
      JAVA_OPTS: -Duser.timezone=America/Sao_Paulo
    ports:
      - "8081:8081"
      - "5006:5006"
    networks:
      - springnet

  restaurant-service:
    image: matheusscola/ordersystem-restaurant-service:test_kafka
    container_name: restaurant-service
    depends_on:
      postgres-restaurant:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-restaurant:5432/restaurantdb
      SPRING_DATASOURCE_USERNAME: restaurantuser
      SPRING_DATASOURCE_PASSWORD: restaurantpass
      DEBUG_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007"
      TZ: America/Sao_Paulo
      JAVA_OPTS: -Duser.timezone=America/Sao_Paulo
    ports:
      - "8082:8082"
      - "5007:5007"
    networks:
      - springnet

volumes:
  pgdata_order:
  pgdata_customer:
  pgdata_restaurant:

networks:
  springnet:
    driver: bridge
